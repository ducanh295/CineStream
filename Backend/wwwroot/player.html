<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStream — HLS Video Test Player</title>
    <!-- Thư viện giải mã HLS.js chuẩn công nghiệp -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f1015;
            color: #ffffff;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 960px;
        }

        header {
            margin-bottom: 24px;
            border-bottom: 1px solid #232530;
            padding-bottom: 16px;
        }

        h1 {
            font-size: 24px;
            color: #e50914; /* Màu đỏ thương hiệu CineStream */
            display: flex;
            align-items: center;
            gap: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: #8b8f9e;
            margin-top: 4px;
        }

        .controls-card {
            background-color: #1a1c24;
            border: 1px solid #282a36;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #0f1015;
            border: 1px solid #3b3e4f;
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #e50914;
        }

        button {
            background-color: #e50914;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #b80710;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            background-color: #000000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #282a36;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            aspect-ratio: 16 / 9;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }

        .status-badge {
            display: inline-block;
            margin-top: 8px;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            background-color: #232530;
            color: #00d26a;
        }

        .logs-card {
            margin-top: 20px;
            background-color: #14151c;
            border: 1px solid #232530;
            border-radius: 8px;
            padding: 14px;
        }

        .logs-title {
            font-size: 13px;
            font-weight: 600;
            color: #8b8f9e;
            margin-bottom: 8px;
        }

        .logs-content {
            font-family: Consolas, monospace;
            font-size: 12px;
            color: #a0a6b8;
            max-height: 160px;
            overflow-y: auto;
            line-height: 1.6;
        }

        .log-item {
            border-bottom: 1px dashed #20222e;
            padding: 2px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>CineStream — Trình Phát Kiểm Thử HLS Video</h1>
            <p class="subtitle">Kiểm thử phát luồng HTTP Live Streaming (.m3u8) và MP4 trực tiếp trước khi tích hợp vào ứng dụng di động</p>
        </header>

        <div class="controls-card">
            <div class="input-group">
                <input type="text" id="videoUrlInput" placeholder="Nhập URL luồng phát (ví dụ: http://localhost:5182/videos/Dai_thoai_tay_du/master.m3u8)" value="http://localhost:5182/videos/Dai_thoai_tay_du/master.m3u8">
                <button id="loadBtn">Tải Phim</button>
            </div>
            <div id="statusBadge" class="status-badge">Sẵn sàng kiểm thử</div>
        </div>

        <div class="player-wrapper">
            <video id="videoPlayer" controls playsinline preload="auto"></video>
        </div>

        <div class="logs-card">
            <div class="logs-title">Nhật ký tải phân đoạn thời gian thực (Real-time Segment Log):</div>
            <div class="logs-content" id="logConsole">
                <div class="log-item">[Hệ thống] Trình phát sẵn sàng. Bấm 'Tải Phim' để bắt đầu phát luồng.</div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const urlInput = document.getElementById('videoUrlInput');
        const loadBtn = document.getElementById('loadBtn');
        const statusBadge = document.getElementById('statusBadge');
        const logConsole = document.getElementById('logConsole');
        let hlsInstance = null;

        function addLog(msg) {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = 'log-item';
            div.textContent = `[${time}] ${msg}`;
            logConsole.prepend(div);
        }

        function loadVideo(url) {
            url = url.trim();
            if (!url) return;

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            statusBadge.textContent = "Đang kết nối luồng...";
            statusBadge.style.color = "#ffaa00";
            addLog(`Đang kết nối tới URL: ${url}`);

            const isHls = url.includes('.m3u8');

            if (isHls && Hls.isSupported()) {
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: false,
                    startPosition: 0
                });

                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                    statusBadge.textContent = "HLS Manifest nạp thành công (Đang phát luồng)";
                    statusBadge.style.color = "#00d26a";
                    addLog(`HLS Manifest nạp thành công. Tìm thấy ${data.levels.length} tầng chất lượng.`);
                    video.play().catch(e => addLog("Bấm Play trên khung phát để xem video."));
                });

                hlsInstance.on(Hls.Events.FRAG_LOADED, function (event, data) {
                    const fragUrl = data.frag.relurl || data.frag.url;
                    const duration = data.frag.duration.toFixed(1);
                    addLog(`Tải phân đoạn: ${fragUrl} (Độ dài: ${duration}s | Dung lượng: ${(data.frag.loaded / 1024).toFixed(1)} KB)`);
                });

                hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        statusBadge.textContent = "Lỗi phát luồng HLS";
                        statusBadge.style.color = "#ff4444";
                        addLog(`Lỗi phát luồng: ${data.details}`);
                    }
                });
            } else {
                // Hỗ trợ Direct MP4 hoặc Safari Native HLS
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    statusBadge.textContent = "Tải video trực tiếp thành công";
                    statusBadge.style.color = "#00d26a";
                    addLog("Đã nạp metadata video trực tiếp.");
                    video.play().catch(e => addLog("Bấm Play trên khung phát để xem video."));
                }, { once: true });

                video.addEventListener('error', function() {
                    statusBadge.textContent = "Lỗi tải video";
                    statusBadge.style.color = "#ff4444";
                    addLog("Không thể tải file video từ đường dẫn đã nhập.");
                }, { once: true });
            }
        }

        loadBtn.addEventListener('click', () => loadVideo(urlInput.value));
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadVideo(urlInput.value);
        });
    </script>
</body>
</html>
